name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore phone-test signing key
        uses: actions/cache@v4
        with:
          path: .phone-test/debug.keystore
          key: redmagic-preview-signing-v2

      - name: Prepare phone-test signing key
        run: |
          if [ ! -f .phone-test/debug.keystore ]; then
            mkdir -p .phone-test
            keytool -genkeypair -keystore .phone-test/debug.keystore -storetype JKS \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build optimized preview APK
        env:
          REDMAGIC_PREVIEW_KEYSTORE: ${{ github.workspace }}/.phone-test/debug.keystore
        run: ./gradlew :app:assemblePreview

      - name: Upload optimized preview APK
        uses: actions/upload-artifact@v4
        with:
          name: redmagic-optimized-apk
          path: app/build/outputs/apk/preview/*.apk
          retention-days: 7

      # Upload the phone-test APK first so regression tests do not delay its download.
      - name: Test regressions
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Check release signing availability
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/red-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/red-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # retention-days, or these pile up until the account runs out of storage. With no value
      # set they inherit the repository default of 90 days, and a ~20 MB debug APK on every push
      # to main reached 2.1 GB across 109 artifacts before anyone noticed. A week is longer than
      # anyone waits to download a CI build.
      - name: Upload signed release APK artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: redmagic-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          # Longer than the debug one: this is the build people actually install, and a tagged
          # build is attached to its Release as well, which is not storage-capped the same way.
          retention-days: 30

      - name: Create GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Redmagic Control Center ${{ github.ref_name }}
          body: |
            Build for ${{ github.ref_name }}

            Included files:
            - Optimized test APK
            ${{ steps.signing.outputs.available == 'true' && '- Signed release APK' || '' }}
          files: |
            app/build/outputs/apk/preview/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
